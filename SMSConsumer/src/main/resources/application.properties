# ==========================================
# Dynamic Application Name and Port
# ==========================================
spring.application.name=SMSConsumer
server.port=${SERVER_PORT:8091}

# ==========================================
# SQL DB Connection Config
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:notification_engine}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:xxxxxxxxxxxxxxx}
spring.datasource.password=${DB_PASSWORD:xxxxxxxxxxxxxxx}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL:10}

# ==========================================
# Kafka Consumer Configurations
# ==========================================
spring.kafka.consumer.group-id=${KAFKA_SMS_CONSUMER_GROUP:group-sms-consumer}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
notification.kafka.consumer.concurrency=${KAFKA_PARTITIONS:10}

# ==========================================
# Confluent / Apache Kafka Cluster Config
# ==========================================
spring.kafka.properties.max.poll.records=${KAFKA_MAX_POLL_RECORDS:50}
spring.kafka.properties.max.poll.interval.ms=${KAFKA_MAX_POLL_INTERVAL:300000}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.session.timeout.ms=${KAFKA_SESSION_TIMEOUT:45000}
spring.kafka.client-id=${KAFKA_CLIENT_ID:sms-consumer-client}

# ==========================================
# Twilio Provider Integrations
# ==========================================
twilio.account-sid=${TWILIO_ACCOUNT_SID:xxxxxxxxxxxxxxx}
twilio.auth-token=${TWILIO_AUTH_TOKEN:xxxxxxxxxxxxxxx}
twilio.from-number=${TWILIO_FROM_SMS_NUMBER:+xxxxxxxxxxxxxxx}

# ==========================================
# Resilience4j Circuit Breaker & Retry (SMS Vendor)
# ==========================================
resilience4j.circuitbreaker.instances.smsVendor.slidingWindowSize=${RESILIENCE_CB_SLIDING_WINDOW:10}
resilience4j.circuitbreaker.instances.smsVendor.failureRateThreshold=${RESILIENCE_CB_FAILURE_THRESHOLD:50}
resilience4j.circuitbreaker.instances.smsVendor.waitDurationInOpenState=${RESILIENCE_CB_WAIT_DURATION:10000ms}
resilience4j.circuitbreaker.instances.smsVendor.permittedNumberOfCallsInHalfOpenState=${RESILIENCE_CB_HALF_OPEN_CALLS:3}
resilience4j.circuitbreaker.instances.smsVendor.ignoreExceptions=com.notificationengine.SMSConsumer.service.exceptions.FatalVendorException

resilience4j.ratelimiter.instances.smsVendor.limitForPeriod=${TWILIO_RATE_LIMIT:10}
resilience4j.ratelimiter.instances.smsVendor.limitRefreshPeriod=${TWILIO_RATE_REFRESH:1s}
resilience4j.ratelimiter.instances.smsVendor.timeoutDuration=${TWILIO_RATE_TIMEOUT:5s}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} - [%X{correlationId}] - %logger{36} - %-5level - %msg%n

# ==========================================
# Observability & Metrics
# ==========================================
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true