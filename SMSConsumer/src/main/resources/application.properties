# ==========================================
# Dynamic Application Name and Port
# ==========================================
spring.application.name=SMSConsumer
server.port=${SERVER_PORT:8091}

# ==========================================
# SQL DB Connection Config
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:notification_engine}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:xxxxxxxxxxxxxxx}
spring.datasource.password=${DB_PASSWORD:xxxxxxxxxxxxxxx}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL:10}

# ==========================================
# Kafka Consumer Configurations
# ==========================================
spring.kafka.consumer.group-id=${KAFKA_SMS_CONSUMER_GROUP:group-sms-consumer}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable.auto.commit=true
spring.kafka.consumer.auto.commit.interval.ms=5000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Rate limiting for Twilio/WhatsApp provider protection
spring.kafka.properties.max.poll.records=${KAFKA_MAX_POLL_RECORDS:600}

# ==========================================
# Confluent / Apache Kafka Cluster Config
# ==========================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.session.timeout.ms=${KAFKA_SESSION_TIMEOUT:45000}
spring.kafka.client-id=${KAFKA_CLIENT_ID:sms-consumer-client}

# ==========================================
# Twilio Provider Integrations
# ==========================================
twilio.account-sid=${TWILIO_ACCOUNT_SID:xxxxxxxxxxxxxxx}
twilio.auth-token=${TWILIO_AUTH_TOKEN:xxxxxxxxxxxxxxx}
twilio.from-number=${TWILIO_FROM_SMS_NUMBER:+xxxxxxxxxxxxxxx}

# ==========================================
# Resilience4j Circuit Breaker & Retry (SMS Vendor)
# ==========================================
resilience4j.circuitbreaker.instances.smsVendor.slidingWindowSize=${RESILIENCE_CB_SLIDING_WINDOW:10}
resilience4j.circuitbreaker.instances.smsVendor.failureRateThreshold=${RESILIENCE_CB_FAILURE_THRESHOLD:50}
resilience4j.circuitbreaker.instances.smsVendor.waitDurationInOpenState=${RESILIENCE_CB_WAIT_DURATION:10000ms}
resilience4j.circuitbreaker.instances.smsVendor.permittedNumberOfCallsInHalfOpenState=${RESILIENCE_CB_HALF_OPEN_CALLS:3}

resilience4j.retry.instances.smsVendor.maxAttempts=${RESILIENCE_RETRY_MAX:3}
resilience4j.retry.instances.smsVendor.waitDuration=${RESILIENCE_RETRY_DURATION:500ms}
resilience4j.retry.instances.smsVendor.exponentialBackoff.multiplier=${RESILIENCE_RETRY_MULTIPLIER:2}

# ==========================================
# Logging Configuration
# ==========================================
# Log Levels
logging.level.root=INFO
logging.level.com.notificationengine=DEBUG

# File Location (Creates a 'logs' folder in the directory where the jar runs)
logging.file.name=logs/${spring.application.name}.log

# The Format: Time - (ClassName) - Level - Message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} - [%X{correlationId}] - (%logger{36}) - %-5level - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} - [%X{correlationId}] - (%logger{36}) - %-5level - %msg%n

# Rolling Policy: Daily rolling, max 10MB per file, keep 30 days of history
logging.logback.rollingpolicy.file-name-pattern=logs/${spring.application.name}-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=3GB

# ==========================================
# Observability & Metrics
# ==========================================
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always