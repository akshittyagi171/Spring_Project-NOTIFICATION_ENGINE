# ==========================================
# Dynamic Application Name and Port
# ==========================================
spring.application.name=NotificationProcessor-Priority-${NOTIFICATION_PRIORITY:1}
server.port=${SERVER_PORT:8081}

# ==========================================
# SQL DB Connection Config
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:notification_engine}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:xxxxxxxxxxxxxxx}
spring.datasource.password=${DB_PASSWORD:xxxxxxxxxxxxxxx}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL:10}

# ==========================================
# Dynamic Consumer Group Config (Priority Isolated)
# ==========================================
spring.kafka.consumer.group-id=group-priority-${NOTIFICATION_PRIORITY:1}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ==========================================
# Producer Configuration - CUSTOM PARTITIONER
# ==========================================
spring.kafka.producer.properties.notification.processor.priority=${NOTIFICATION_PRIORITY:1}
spring.kafka.producer.properties.notification.topic.partitions=${KAFKA_PARTITIONS:10}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.properties.partitioner.class=com.notificationengine.NotificationProcessor.config.CustomPartitioner

# ==========================================
# Dynamic Application Business Properties
# ==========================================
notification.kafka.topic.partitions=${KAFKA_PARTITIONS:10}
notification.processor.priority=${NOTIFICATION_PRIORITY:1}
notification.processor.topic=priority-${NOTIFICATION_PRIORITY:1}

# ==========================================
# Confluent / Apache Kafka Cluster Config
# ==========================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.session.timeout.ms=${KAFKA_SESSION_TIMEOUT:45000}
spring.kafka.client-id=notification-processor-client-${NOTIFICATION_PRIORITY:1}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} - [%X{correlationId}] - %logger{36} - %-5level - %msg%n

# ==========================================
# Observability & Metrics
# ==========================================
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true