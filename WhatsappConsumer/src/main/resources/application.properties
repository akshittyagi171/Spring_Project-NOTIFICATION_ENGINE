# ==========================================
# HashiCorp Vault Configuration
# ==========================================
spring.config.import=optional:vault://
spring.cloud.vault.uri=${VAULT_URI:http://localhost:8200}
spring.cloud.vault.token=${VAULT_TOKEN:root}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=notification-engine/common
spring.cloud.vault.kv.application-name=notification-engine/whatsapp-consumer

# ==========================================
# Dynamic Application Name and Port
# ==========================================
spring.application.name=WhatsAppConsumer
server.port=${SERVER_PORT:8093}

# ==========================================
# SQL DB Connection Config
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:notification_engine}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:xxxxxxxxxxxxxxx}
spring.datasource.password=${DB_PASSWORD:xxxxxxxxxxxxxxx}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL:20}

# ==========================================
# Kafka Consumer Configurations
# ==========================================
spring.kafka.consumer.group-id=${KAFKA_WHATSAPP_CONSUMER_GROUP:group-whatsapp-consumer}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
notification.kafka.consumer.concurrency=${KAFKA_PARTITIONS:10}
spring.kafka.properties.max.poll.records=${KAFKA_MAX_POLL_RECORDS:50}
spring.kafka.properties.max.poll.interval.ms=${KAFKA_MAX_POLL_INTERVAL:300000}

# ==========================================
# Resilience4j Rate Limiter (Twilio API protection)
# ==========================================
resilience4j.ratelimiter.instances.whatsAppVendor.limitForPeriod=${TWILIO_RATE_LIMIT:10}
resilience4j.ratelimiter.instances.whatsAppVendor.limitRefreshPeriod=${TWILIO_RATE_REFRESH:1s}
resilience4j.ratelimiter.instances.whatsAppVendor.timeoutDuration=${TWILIO_RATE_TIMEOUT:5s}

# ==========================================
# Confluent / Apache Kafka Cluster Config
# ==========================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.session.timeout.ms=${KAFKA_SESSION_TIMEOUT:45000}
spring.kafka.client-id=${KAFKA_CLIENT_ID:whatsapp-consumer-client}

# ==========================================
# Twilio / WhatsApp Provider Configs
# ==========================================
twilio.account-sid=${TWILIO_ACCOUNT_SID:xxxxxxxxxxxxxxx}
twilio.auth-token=${TWILIO_AUTH_TOKEN:xxxxxxxxxxxxxxx}
twilio.from-number=${TWILIO_FROM_WHATSAPP_NUMBER:+xxxxxxxxxxxxxxx}

# ==========================================
# Resilience4j Circuit Breaker & Retry (WhatsApp Vendor)
# ==========================================
resilience4j.circuitbreaker.instances.whatsAppVendor.slidingWindowSize=${RESILIENCE_CB_SLIDING_WINDOW:10}
resilience4j.circuitbreaker.instances.whatsAppVendor.failureRateThreshold=${RESILIENCE_CB_FAILURE_THRESHOLD:50}
resilience4j.circuitbreaker.instances.whatsAppVendor.waitDurationInOpenState=${RESILIENCE_CB_WAIT_DURATION:10000ms}
resilience4j.circuitbreaker.instances.whatsAppVendor.permittedNumberOfCallsInHalfOpenState=${RESILIENCE_CB_HALF_OPEN_CALLS:3}
resilience4j.circuitbreaker.instances.whatsAppVendor.ignoreExceptions=com.notificationengine.common.exception.FatalVendorException

# ==========================================
# Observability & Metrics
# ==========================================
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ==========================================
# Loki Logging Connection
# ==========================================
loki.url=${LOKI_URL:http://localhost:3100/loki/api/v1/push}